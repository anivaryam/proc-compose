linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - linters:
        - errcheck
      source: "defer|CloseNow|Close|Release|Restore|SetWriteDeadline|WalkDir|conn\\.Write|os\\.Rename|os\\.Remove"
