name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Build and package binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          mkdir -p "$DIST"
          TMP=""
          trap '[ -z "$TMP" ] || rm -rf "$TMP"' EXIT

          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            bin="proc-compose"
            if [ "$GOOS" = "windows" ]; then
              bin="proc-compose.exe"
            fi

            echo "Building ${GOOS}/${GOARCH}..."
            TMP="$(mktemp -d)"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "${TMP}/${bin}" ./cmd/proc-compose

            archive="proc-compose_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              (cd "$TMP" && python3 -m zipfile --create "$DIST/${archive}.zip" "$bin")
            else
              tar -czf "$DIST/${archive}.tar.gz" -C "$TMP" "$bin"
            fi
            rm -rf "$TMP"
          done

      - name: Validate shared agent skill
        run: go test ./cmd/proc-compose -run '^TestSkill_' -count=1

      - name: Package shared agent skill
        run: |
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          cp -R skills/proc-compose "$STAGE/proc-compose"
          cp LICENSE "$STAGE/proc-compose/LICENSE"
          printf '%s\n' "$GITHUB_REF_NAME" > "$STAGE/proc-compose/VERSION"
          tar -czf "$DIST/proc-compose_skill.tar.gz" -C "$STAGE" proc-compose
          (cd "$STAGE" && python3 -m zipfile --create "$DIST/proc-compose_skill.zip" proc-compose)

      - name: Checksum release assets
        run: (cd "$DIST" && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
